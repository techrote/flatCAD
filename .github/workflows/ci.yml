name: flatCAD CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build (includes worker and WASM)
        run: npm run build

  browser:
    # Playwright 1.56 supports the pinned Ubuntu 24.04 browser image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Build production bundle for browser test
        run: npm run build
      - name: Golden solid and interactive browser tests
        run: npm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatcad-browser-test-results
          path: test-results/
          if-no-files-found: ignore
