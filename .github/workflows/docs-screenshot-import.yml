name: Import accepted flatCAD screenshots (temporary)

on:
  push:
    branches:
      - docs/beta1-readme-guide-20261109
    paths:
      - .github/workflows/docs-screenshot-import.yml

permissions:
  contents: write
  actions: read

jobs:
  import-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/beta1-readme-guide-20261109
          persist-credentials: true
      - name: Copy original PNGs from accepted main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42548862455 --repo techrote/flatCAD \
            --name flatcad-browser-test-results \
            --dir "$RUNNER_TEMP/flatcad-captures"

          workspace="$RUNNER_TEMP/flatcad-captures/cad-production-WASM-generates-golden-plate-and-exact-STEP/golden-preview.png"
          floating="$RUNNER_TEMP/flatcad-captures/cad-multiple-floating-rend-f4b13-tionally-hidden-tiled-Solid/independent-floating-cameras.png"
          test -s "$workspace"
          test -s "$floating"

          mkdir -p docs/images
          cp "$workspace" docs/images/flatcad-workspace.png
          cp "$floating" docs/images/flatcad-floating-views.png

          echo "Expected screenshot SHA-256 checks"
          echo "5578cf95fbe6d5f17ba16d534cc0f541f8250ca0877ef47ba573b0c8f43584c3  docs/images/flatcad-workspace.png" | sha256sum --check
          echo "c80726991a4465b5c2b60f4ec59787c6c96f120427551a2549f9c16c57b8136f  docs/images/flatcad-floating-views.png" | sha256sum --check

          git add docs/images/flatcad-workspace.png docs/images/flatcad-floating-views.png
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: import qualified main UI captures [skip ci]"
          git push origin HEAD:docs/beta1-readme-guide-20261109
